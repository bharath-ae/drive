<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Payment Required</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .notice {
      width: 100%;
      max-width: 560px;
      padding: 36px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5eaf1;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }
    .icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fff2e5;
      color: #b45309;
      font-size: 32px;
      font-weight: bold;
    }
    h1 { margin: 0 0 16px; font-size: 27px; }
    p { margin: 0; color: #5b6473; font-size: 16px; line-height: 1.7; }
    @media (max-width: 480px) {
      .notice { padding: 28px 20px; }
      h1 { font-size: 23px; }
      p { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="notice">
    <div class="icon" aria-hidden="true">!</div>
    <h1>Subscription Payment Required</h1>
    <p>
      Your subscription payment is pending. You cannot access or use our software
      until the subscription amount is paid. Please pay the subscription amount
      to continue using our software without interruption.
      <br><br>
      Thank you for your understanding!
    </p>
  </main>
</body>
</html>
